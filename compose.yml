name: ost-nexus

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ost_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-ost_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ost_nexus_local}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
