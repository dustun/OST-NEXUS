version: "3"

silent: true
dotenv: [".env"]

vars:
  APP_HTTP_PORT: '{{default "8090" .APP_PORT}}'
  BACKEND_DEV_PORT: '{{default "8100" .BACKEND_PORT}}'
  FRONTEND_DEV_PORT: '{{default "3100" .FRONTEND_PORT}}'
  DATABASE_HOST_PORT: '{{default "54320" .DB_FORWARD_PORT}}'
  DATABASE_NAME: '{{default "ost_nexus" .POSTGRES_DB}}'
  DATABASE_USER: '{{default "ost_nexus" .POSTGRES_USER}}'
  DATABASE_PASSWORD: '{{default "ost_nexus_local" .POSTGRES_PASSWORD}}'

tasks:
  default:
    desc: Показать список доступных команд
    cmds:
      - task --list

  help:
    desc: Показать список доступных команд
    cmds:
      - task --list

  doctor:
    desc: Проверить наличие Docker, Caddy, PHP, Composer, Node.js и npm
    cmds:
      - docker --version
      - docker compose version
      - caddy version
      - php --version
      - composer --version
      - node --version
      - npm --version

  setup:
    desc: Первый запуск — создать env-файлы, установить зависимости и выполнить миграции
    cmds:
      - task: doctor
      - test -f .env || cp .env.example .env
      - test -f backend/.env || cp backend/.env.example backend/.env
      - docker compose pull
      - docker compose up -d
      - task: backend:setup
      - task: frontend:setup

  dev:
    desc: Запустить PostgreSQL, Caddy, Laravel и Next.js вместе в режиме разработки
    preconditions:
      - sh: test -f .env
        msg: Сначала выполните task setup — отсутствует корневой файл .env
      - sh: test -f backend/.env
        msg: Сначала выполните task setup — отсутствует backend/.env
    deps:
      - task: infra:up
      - task: caddy:serve
      - task: backend:serve
      - task: frontend:serve

  up:
    desc: Запустить PostgreSQL в фоновом режиме
    cmds:
      - docker compose up -d

  down:
    aliases: [stop]
    desc: Остановить все контейнеры, сохранив данные PostgreSQL
    cmds:
      - docker compose --profile tools down

  restart:
    desc: Перезапустить PostgreSQL
    cmds:
      - docker compose restart db

  status:
    aliases: [ps]
    desc: Показать состояние контейнеров проекта
    cmds:
      - docker compose --profile tools ps

  logs:
    desc: Показывать журнал PostgreSQL в реальном времени
    cmds:
      - docker compose logs -f --tail=200 db

  shell:
    desc: Открыть Bash внутри backend CLI-контейнера
    preconditions:
      - sh: test -f backend/.env
        msg: Сначала выполните task setup — отсутствует backend/.env
    cmds:
      - docker compose --profile tools up -d --build db backend-cli
      - docker compose --profile tools exec backend-cli bash

  admin:create:
    desc: Создать или обновить администратора из переменных backend/.env
    preconditions:
      - sh: test -f backend/.env
        msg: Сначала выполните task setup — отсутствует backend/.env
    cmds:
      - docker compose --profile tools up -d --build db backend-cli
      - docker compose --profile tools exec -T backend-cli php artisan admin:create

  migrate:
    desc: Применить новые миграции базы данных
    dir: backend
    env: &database
      APP_NAME: OST NEXUS
      APP_URL: http://localhost:{{.APP_HTTP_PORT}}
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "{{.DATABASE_HOST_PORT}}"
      DB_DATABASE: "{{.DATABASE_NAME}}"
      DB_USERNAME: "{{.DATABASE_USER}}"
      DB_PASSWORD: "{{.DATABASE_PASSWORD}}"
    cmds:
      - php artisan migrate

  migrate:rollback:
    desc: Откатить последнюю группу миграций
    dir: backend
    env: *database
    cmds:
      - php artisan migrate:rollback

  db:seed:
    desc: Загрузить тестовые и справочные данные
    dir: backend
    env: *database
    cmds:
      - php artisan db:seed

  test:
    desc: Выполнить все проверки backend, frontend и конфигурации окружения
    cmds:
      - task: config:check
      - task: backend:check
      - task: frontend:check

  format:
    desc: Отформатировать PHP-код с помощью Laravel Pint
    cmds:
      - task: backend:format

  config:check:
    desc: Проверить конфигурации Docker Compose и Caddy
    cmds:
      - docker compose --profile tools config --quiet
      - caddy validate --config docker/caddy/Caddyfile --adapter caddyfile

  backend:test:
    desc: Запустить тесты Laravel
    dir: backend
    cmds:
      - php artisan test

  backend:format:
    desc: Отформатировать PHP-код
    dir: backend
    cmds:
      - ./vendor/bin/pint

  backend:check:
    desc: Проверить тесты и стиль PHP-кода без изменения файлов
    dir: backend
    cmds:
      - php artisan test
      - ./vendor/bin/pint --test

  frontend:lint:
    desc: Проверить TypeScript и React с помощью ESLint
    dir: frontend
    cmds:
      - npm run lint

  frontend:build:
    desc: Собрать production-версию frontend
    dir: frontend
    cmds:
      - npm run build

  frontend:check:
    desc: Проверить frontend и выполнить production-сборку
    dir: frontend
    cmds:
      - npm run lint
      - npm run build

  infra:up:
    internal: true
    cmds:
      - docker compose up -d

  caddy:serve:
    internal: true
    cmds:
      - caddy run --config docker/caddy/Caddyfile --adapter caddyfile

  backend:setup:
    internal: true
    dir: backend
    env: *database
    cmds:
      - composer install --no-interaction
      - grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force
      - php artisan migrate --force

  frontend:setup:
    internal: true
    dir: frontend
    cmds:
      - npm ci

  backend:serve:
    internal: true
    dir: backend
    env: *database
    cmds:
      - php artisan serve --host=127.0.0.1 --port={{.BACKEND_DEV_PORT}}

  frontend:serve:
    internal: true
    dir: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    cmds:
      - npm run dev -- --hostname 127.0.0.1 --port {{.FRONTEND_DEV_PORT}}
